<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosaic — 習慣で写真を現像する</title>
<meta name="description" content="習慣を続けるほど写真が現れる。目標は無制限に追加できます。">
<meta name="theme-color" content="#101416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mosaic">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- ============ 一覧画面 ============ -->
<main id="view-list" class="view is-active">
  <header class="topbar">
    <div class="topbar__title">
      <span class="eyebrow">現像中</span>
      <h1 class="wordmark">Mosaic</h1>
    </div>
    <button id="btn-menu" class="iconbtn" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
    </button>
  </header>

  <div id="list-empty" class="empty" hidden>
    <div class="empty__grid" aria-hidden="true"></div>
    <h2>最初の1枚を隠そう</h2>
    <p>写真を選んで目標を決めると、写真がグレーのタイルで覆われます。<br>1日達成するごとにタイルが1枚ずつ外れます。</p>
    <button class="btn btn--primary" data-action="new">目標を追加</button>
  </div>

  <ul id="goal-list" class="sheet"></ul>

  <button id="fab" class="fab" aria-label="目標を追加">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span>目標を追加</span>
  </button>
</main>

<!-- ============ 詳細画面 ============ -->
<main id="view-detail" class="view">
  <header class="topbar topbar--detail">
    <button id="btn-back" class="iconbtn" aria-label="一覧へ戻る">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2 id="detail-title" class="topbar__heading"></h2>
    <button id="btn-goal-menu" class="iconbtn" aria-label="この目標の設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
    </button>
  </header>

  <div class="detail__scroll">
    <div class="frame">
      <div id="mosaic" class="mosaic">
        <img id="mosaic-img" class="mosaic__img" alt="">
        <div id="mosaic-tiles" class="mosaic__tiles"></div>
      </div>
      <div class="frame__edge">
        <span id="frame-range" class="mono"></span>
        <span id="frame-count" class="mono"></span>
      </div>
    </div>

    <section class="readout">
      <div class="readout__main">
        <span id="stat-pct" class="readout__pct mono">0<i>%</i></span>
        <span class="readout__label">完成度</span>
      </div>
      <div class="readout__bar" role="img" aria-label="完成度">
        <div id="stat-bar" class="readout__fill"></div>
        <div id="stat-elapsed" class="readout__elapsed"></div>
      </div>
      <dl class="stats">
        <div><dt>開いたタイル</dt><dd id="stat-open" class="mono">0</dd></div>
        <div><dt>これまでの達成率</dt><dd id="stat-rate" class="mono">0%</dd></div>
        <div><dt>連続</dt><dd id="stat-streak" class="mono">0</dd></div>
        <div><dt>残り</dt><dd id="stat-left" class="mono">0</dd></div>
      </dl>
    </section>
  </div>

  <div class="dock">
    <button id="btn-today" class="btn btn--primary btn--wide"></button>
    <button id="btn-fix" class="btn btn--ghost">記録を修正</button>
  </div>
</main>

<!-- ============ 目標の作成 / 編集 ============ -->
<div id="editor" class="scrim" hidden>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="editor-title">
    <header class="panel__head">
      <h2 id="editor-title">目標を追加</h2>
      <button class="iconbtn" data-close="editor" aria-label="閉じる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="panel__body">
      <div class="field">
        <span class="field__label">写真</span>
        <div id="photo-drop" class="photo-drop" role="button" tabindex="0">
          <img id="photo-preview" alt="" hidden>
          <span id="photo-hint" class="photo-drop__hint">タップして写真を選ぶ</span>
        </div>
        <input id="photo-input" type="file" accept="image/*" hidden>
      </div>

      <label class="field">
        <span class="field__label">目標の名前</span>
        <input id="f-title" type="text" placeholder="例：毎朝ストレッチ" maxlength="40" autocomplete="off">
      </label>

      <div class="field-row">
        <label class="field">
          <span class="field__label">開始日</span>
          <input id="f-start" type="date">
        </label>
        <label class="field">
          <span class="field__label">期限</span>
          <input id="f-end" type="date">
        </label>
      </div>

      <label class="check">
        <input id="f-noend" type="checkbox">
        <span>期限を決めない（1年間 / 365タイル）</span>
      </label>

      <p id="editor-calc" class="calc mono"></p>
      <p id="editor-error" class="error" hidden></p>
    </div>

    <footer class="panel__foot">
      <button class="btn btn--ghost" data-close="editor">やめる</button>
      <button id="btn-save" class="btn btn--primary">保存する</button>
    </footer>
  </section>
</div>

<!-- ============ 1日の記録シート ============ -->
<div id="daysheet" class="scrim" hidden>
  <section class="panel panel--short" role="dialog" aria-modal="true" aria-labelledby="daysheet-title">
    <header class="panel__head">
      <h2 id="daysheet-title">記録を修正</h2>
      <button class="iconbtn" data-close="daysheet" aria-label="閉じる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="panel__body">
      <label class="field">
        <span class="field__label">日付</span>
        <input id="d-date" type="date">
      </label>
      <p id="d-meta" class="calc mono"></p>
      <p id="d-error" class="error" hidden></p>
    </div>
    <footer class="panel__foot">
      <button id="btn-day-clear" class="btn btn--ghost">達成を取り消す</button>
      <button id="btn-day-set" class="btn btn--primary">達成にする</button>
    </footer>
  </section>
</div>

<!-- ============ メニュー ============ -->
<div id="menu" class="scrim" hidden>
  <section class="panel panel--short" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <header class="panel__head">
      <h2 id="menu-title">設定</h2>
      <button class="iconbtn" data-close="menu" aria-label="閉じる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="panel__body menu-body">
      <p class="calc">記録はこの端末の中だけに保存されます。機種変更やブラウザのデータ消去に備えて、ときどき書き出しておくと安心です。</p>
      <button id="btn-export" class="btn btn--ghost btn--wide">データを書き出す</button>
      <button id="btn-import" class="btn btn--ghost btn--wide">データを読み込む</button>
      <input id="import-input" type="file" accept="application/json,.json" hidden>
      <p class="calc" id="menu-stat"></p>
    </div>
  </section>
</div>

<!-- ============ 目標メニュー ============ -->
<div id="goalmenu" class="scrim" hidden>
  <section class="panel panel--short" role="dialog" aria-modal="true" aria-labelledby="goalmenu-title">
    <header class="panel__head">
      <h2 id="goalmenu-title">この目標</h2>
      <button class="iconbtn" data-close="goalmenu" aria-label="閉じる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="panel__body menu-body">
      <button id="btn-edit" class="btn btn--ghost btn--wide">目標を編集する</button>
      <button id="btn-delete" class="btn btn--danger btn--wide">目標を削除する</button>
    </div>
  </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./app.js"></script>
</body>
</html>
